name: 朝のTrello通知

on:
  schedule:
    # 平日 朝8:30 JST に実行
    # ※ GitHub Actions の cron は UTC。JST 8:30 月-金 = UTC 23:30 日-木
    - cron: '30 23 * * 0-4'
  
  # 手動実行も可能（Actions タブから「Run workflow」ボタン）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Trello notification script
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          NOTIFICATION_CARD_ID: ${{ secrets.NOTIFICATION_CARD_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: node scripts/notify.js
