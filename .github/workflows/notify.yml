name: 朝のTrello通知

on:
  schedule:
    # 平日 朝8:30 JST に実行
    # ※ GitHub Actions の cron は UTC。JST 8:30 月-金 = UTC 23:30 日-木
    - cron: '30 23 * * 0-4'
  
  # 手動実行（Actions タブから「Run workflow」ボタン）
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'テストモード（投稿せずプレビューのみログに出力）'
        required: false
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run Trello notification script
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: node scripts/notify.js
